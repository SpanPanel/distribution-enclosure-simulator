name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. A `branches:` filter here means a PR
  # targeting anything other than `main` gets no checks at all, silently: the PR
  # simply reports "no checks reported" and reads as unvalidated rather than
  # failing. That hides every stacked PR, which is exactly when a second pair of
  # eyes is worth most. Every other repo in the eBus family already runs
  # unfiltered; this one was the outlier.
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy --strict src tests

      - name: Pytest
        run: uv run pytest tests --tb=short
