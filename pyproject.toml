[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panel-sim"
version = "0.2.0"
description = "Producer-side Homie publisher with embedded behaviour runtime for the eBus convention"
authors = [
    {name = "Bill Flood"},
    {name = "Clark Communications Corporation"},
]
keywords = ["homie", "homie5", "mqtt", "iot", "ebus", "simulator", "span", "distribution-enclosure", "energy"]
requires-python = ">=3.11"
dependencies = [
    "ebus-sdk>=0.19,<0.20",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.urls]
Homepage = "https://ebus.energy"
Repository = "https://github.com/electrification-bus/distribution-enclosure-simulator"
Issues = "https://github.com/electrification-bus/distribution-enclosure-simulator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_sim"]

[tool.hatch.build.targets.wheel.force-include]
"src/panel_sim/wire/profiles" = "panel_sim/wire/profiles"
"src/panel_sim/wire/mapping" = "panel_sim/wire/mapping"
"src/panel_sim/wire/catalogs" = "panel_sim/wire/catalogs"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
# TC001/TC002/TC003 (move imports into TYPE_CHECKING blocks) conflicts with mypy's
# preference for runtime-resolvable imports. We rely on `from __future__ import
# annotations` which makes runtime cost a non-issue, so leave imports at module top.
ignore = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true


[[tool.mypy.overrides]]
module = "ebus_sdk.*"
ignore_missing_imports = true
