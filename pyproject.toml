[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panel-sim"
version = "0.1.0"
description = "Producer-side Homie publisher with embedded behaviour runtime for the eBus convention"
requires-python = ">=3.11"
dependencies = [
    "ebus-sdk>=0.12,<0.13",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.urls]
Repository = "TBD"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_sim"]

[tool.hatch.build.targets.wheel.force-include]
"src/panel_sim/wire/profiles" = "panel_sim/wire/profiles"
"src/panel_sim/wire/mapping" = "panel_sim/wire/mapping"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
# TC001/TC002/TC003 (move imports into TYPE_CHECKING blocks) conflicts with mypy's
# preference for runtime-resolvable imports. We rely on `from __future__ import
# annotations` which makes runtime cost a non-issue, so leave imports at module top.
ignore = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

# `ebus-sdk` ships without a `py.typed` marker; mypy cannot resolve its stubs.
# ``ignore_missing_imports`` is the only legitimate ignore here: it surfaces the
# upstream gap rather than masking emitter-side type errors.
[[tool.mypy.overrides]]
module = "ebus_sdk"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ebus_sdk.*"
ignore_missing_imports = true
