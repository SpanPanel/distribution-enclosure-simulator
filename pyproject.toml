[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dist-enc-sim"
version = "0.1.0"
description = "Producer-side Homie publisher with embedded behaviour runtime for the eBus convention"
requires-python = ">=3.14"
dependencies = [
    "ebus-sdk>=0.1.5",
    "pyyaml>=6.0",
    "paho-mqtt>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "amqtt>=0.11",     # in-process MQTT broker for integration tests
    "aiomqtt>=2.0",    # async MQTT client for tests + producer adapters
]

[project.urls]
Repository = "TBD"

[tool.hatch.build.targets.wheel]
packages = ["src/dist_enc_sim"]

[tool.hatch.build.targets.wheel.force-include]
"src/dist_enc_sim/wire/profiles" = "dist_enc_sim/wire/profiles"
"src/dist_enc_sim/wire/mapping" = "dist_enc_sim/wire/mapping"

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
# TC001/TC002/TC003 (move imports into TYPE_CHECKING blocks) conflicts with mypy's
# preference for runtime-resolvable imports. We rely on `from __future__ import
# annotations` which makes runtime cost a non-issue, so leave imports at module top.
ignore = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true

# `paho-mqtt` and `ebus-sdk` ship without `py.typed` markers; mypy cannot resolve their
# stubs. ``ignore_missing_imports`` is the only legitimate ignore here — it surfaces
# the upstream gap rather than masking emitter-side type errors.
[[tool.mypy.overrides]]
module = "paho.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ebus_sdk"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ebus_sdk.*"
ignore_missing_imports = true
